server:
  port: ${PLATO_PORT:8082}
spring:
  datasource:
    url: ${PLATO_DB_URL}
    username: ${PLATO_DB_USERNAME}
    password: ${PLATO_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
