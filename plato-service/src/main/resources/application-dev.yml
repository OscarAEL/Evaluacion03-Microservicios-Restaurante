server:
  port: 8082
spring:
  datasource:
    url: ${PLATO_DB_URL:jdbc:mysql://localhost:3306/bd_plato_eval03}
    username: ${PLATO_DB_USERNAME:root}
    password: ${PLATO_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
