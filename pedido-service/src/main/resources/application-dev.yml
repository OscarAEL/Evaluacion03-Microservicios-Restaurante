server:
  port: 8083
spring:
  datasource:
    url: ${PEDIDO_DB_URL:jdbc:mysql://localhost:3306/bd_pedido_eval03}
    username: ${PEDIDO_DB_USERNAME:root}
    password: ${PEDIDO_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
services:
  cliente:
    url: ${CLIENTE_SERVICE_URL:http://localhost:8081}
  plato:
    url: ${PLATO_SERVICE_URL:http://localhost:8082}
